<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galería Fancybox + Bootstrap</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Fancybox CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@fancyapps/ui/dist/fancybox.css"
  />
  <style>
    .img-fluid {
        max-width: 100%!important;
        height: 300px;
        object-fit: cover;
        
    }
  </style>
</head>
<body class="bg-light py-5">

  <div class="container">
    <h1 class="mb-4 text-center">Galería con Fancybox y Bootstrap</h1>
    <div class="row">

      <!-- Imagen 1 -->
      <div class="col-sm-4">
        <a data-fancybox="gallery" href="https://picsum.photos/id/1015/800/600">
          <img src="https://picsum.photos/id/1015/300/200" class="img-fluid rounded shadow-sm" alt="Montaña" />
        </a>
      </div>

      <!-- Imagen 2 -->
      <div class="col-sm-4">
        <a data-fancybox="gallery" href="https://picsum.photos/id/1016/800/600">
          <img src="https://picsum.photos/id/1016/300/200" class="img-fluid rounded shadow-sm" alt="Playa" />
        </a>
      </div>

      <!-- Imagen 3 -->
      <div class="col-sm-4">
        <a data-fancybox="gallery" href="https://picsum.photos/id/1018/800/600">
          <img src="https://picsum.photos/id/1018/300/200" class="img-fluid rounded shadow-sm" alt="Bosque" />
        </a>
      </div>

    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Fancybox JS -->
  <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui/dist/fancybox.umd.js"></script>

  <!-- Configuración opcional -->
  <script>
    Fancybox.bind("[data-fancybox='gallery']", {
      Thumbs: { autoStart: true },
      Toolbar: {
        display: ['zoom', 'slideshow', 'fullscreen', 'download', 'close'],
      },
    });
  </script>

</body>
</html>
