<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Validación de Formulario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/main.css">
</head>

<body>

  <div class="container mt-5">
    <h1 class="mb-4">Validación de Formulario</h1>

    <!-- Alerta oculta que se mostrará al enviar el formulario exitosamente -->
    <div class="alert alert-success d-none" role="alert">
      ¡Formulario enviado correctamente!
    </div>

    <!-- Formulario a validar -->
<form id="contacto" novalidate>
  <div class="mb-3">
    <label class="form-label">Nombres</label>
    <input type="text" name="nombres" class="form-control" placeholder="Ej: Ana María">
  </div>

  <div class="mb-3">
    <label class="form-label">Apellidos</label>
    <input type="text" name="apellidos" class="form-control" placeholder="Ej: Pérez González">
  </div>

  <div class="mb-3">
    <label class="form-label">Correo electrónico</label>
    <input type="email" name="email" class="form-control" placeholder="ejemplo@correo.com">
  </div>

  <div class="mb-3">
    <label class="form-label">RUT</label>
    <input type="text" name="rut" class="form-control" placeholder="12.345.678-5">
  </div>

  <button class="btn btn-primary" type="submit">Enviar</button>
</form>

<div class="alert alert-success d-none mt-3" role="alert">
  ¡Formulario enviado con éxito!
</div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.js"
    integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/jquery.validation/1.15.0/jquery.validate.min.js"></script>

  <script src="assets/js/main.js"></script>

</body>

</html>
