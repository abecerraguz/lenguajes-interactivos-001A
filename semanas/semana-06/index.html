<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <script src="https://kit.fontawesome.com/f6f28e61f7.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="assets/css/styles.css">
  <title>Chat</title>
</head>

<body>

  <!-- Inicio del container del chat -->
  <div class="chat">

    <!-- Inicio del header chat__header -->
      <div class="chat__header">
        <div class="chat__header-logo">
          <img src="./assets/img/chat-de-burbujas.png" alt="logo" />
        </div>
        <div class="chat__header-button">
          <button class="chat__header-button-buttonOne"> <i class="fa-regular fa-envelope"></i>Inscribirme</button>
          <button class="chat__header-button-buttonTwo"> <i class="fa-solid fa-arrow-right-to-bracket"></i>Iniciar
            sesión</button>
        </div>
      </div>
      <!-- /fin chat__header -->
      <div class="chat__body">
        <h1>Como de costumbre comenta la fotografía de la semana ... </h1>
        <img src="./assets/img/homer.jpg" alt="logo" class="chat__body-img" />
        <div class="chat__comentarios">0 Comentarios</div>
        <button class="chat__comentario" id="buttonModalComentarios">Hacer comentario</button>
      </div>
    <!-- Cierre del header chat__header -->

    <!-- Inicio chat__body -->
    <div class="chat__body" id="chat">




    </div>
    <!-- /Cierre chat__body -->

  </div>
  <!-- Cierre del container del chat -->



  <!-- Inicio Modal -->
  <div class="modal fade" id="modalComentarios" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="form-floating">
            <form id="formulario">

              <div class="mb-3">
                <input class="form-control" placeholder="Ingrese usuario" id="user"></input>
              </div>

              <div class="mb-3">
                <textarea class="form-control" placeholder="Ingrese su comentario" id="infoTextArea"
                  style="height: 100px"></textarea>
              </div>

              <small id="alerta"></small>
              <input type="submit" value="Enviar comentario" class="button">

            </form>


          </div>
        </div>
        <div class="modal-footer">
      
        </div>
      </div>
    </div>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <script src="./assets/js/main.js"></script>
</body>

</html>
