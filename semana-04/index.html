<!DOCTYPE html>
<!-- Declaración del tipo de documento: le indica al navegador que usamos HTML5 -->
<html lang="es">
<!-- lang="es": define el idioma del contenido (útil para SEO y lectores de pantalla) -->

<head>
    <!-- UTF-8: codificación que permite tildes, ñ y caracteres especiales -->
    <meta charset="UTF-8">

    <!-- viewport: hace la página responsiva en dispositivos móviles -->
    <!-- width=device-width → ancho = ancho del dispositivo           -->
    <!-- initial-scale=1.0  → sin zoom inicial                        -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título que aparece en la pestaña del navegador -->
    <title>DOM - Manipulación con JavaScript</title>

    <!-- Bootstrap 5: framework CSS que nos da estilos y componentes responsivos listos para usar -->
    <!-- integrity: hash de seguridad para verificar que el archivo no fue alterado (SRI) -->
    <!-- crossorigin: necesario para que funcione la verificación de integridad entre dominios -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Nuestro CSS personalizado (cargado DESPUÉS de Bootstrap para poder sobrescribir sus estilos) -->
    <link rel="stylesheet" href="assets/css/main.css">
</head>

<body>

    <!-- .container: clase Bootstrap que centra el contenido y aplica un ancho máximo -->
    <!-- .text-center: centra el texto dentro del contenedor                           -->
    <!-- .mt-5: agrega un margen superior (margin-top) de nivel 5                     -->
    <div class="container text-center mt-5">

        <!-- Título principal de la sección -->
        <h1>🌟 DOM 🌟</h1>

        <!-- Línea divisoria horizontal -->
        <!-- IMPORTANTE: JavaScript buscará este <hr> con document.querySelector('hr') -->
        <!-- para insertar un nuevo párrafo creado dinámicamente justo después de él   -->
        <hr>

        <!-- Barra de navegación con los botones de acción del DOM -->
        <!-- Cada botón tiene un id único para ser seleccionado desde JavaScript        -->
        <!-- .gap-5: espaciado entre elementos  |  .mb-3: margen inferior              -->
        <nav class="gap-5 mb-3">

            <!-- Botón 1: al hacer clic cambia (o restaura) el color de TODOS los títulos -->
            <!-- id="buttonChangeColor" → JavaScript lo captura con getElementById()     -->
            <a href="#" class="btn btn-primary" id="buttonChangeColor">Cambiar color a los titulos</a>

            <!-- Botón 2: al hacer clic cambia (o restaura) el texto del TERCER título -->
            <a href="#" class="btn btn-primary" id="buttonInnerText">Cambiar texto</a>

            <!-- Botón 3: al hacer clic cambia (o restaura) el atributo src de la TERCERA imagen -->
            <a href="#" class="btn btn-primary" id="buttonSetAttr">Cambiar atributo</a>

            <!-- Botón 4: al hacer clic CREA un nuevo elemento <p> en el DOM dinámicamente -->
            <!-- .btn-success: estilo verde de Bootstrap para indicar una acción positiva  -->
            <a href="#" class="btn btn-success" id="buttonCreateElement">Crear etiqueta</a>

        </nav>

        <!-- Contenido principal de la página -->
        <main>
            <!-- .row: clase Bootstrap que define una fila dentro del sistema de grilla (grid) -->
            <!-- id="innerCard": JavaScript inyectará aquí las tarjetas generadas dinámicamente -->
            <!-- Las cards se crearán con JavaScript — este div empieza VACÍO a propósito       -->
            <div class="row" id="innerCard">
            </div>
        </main>

    </div>

    <!-- Bootstrap Bundle JS: incluye Bootstrap JS + Popper.js -->
    <!-- Necesario para componentes interactivos: modals, dropdowns, tooltips, etc. -->
    <!-- Se coloca al FINAL del <body> para no bloquear la carga del HTML            -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <!-- Nuestro archivo JavaScript principal con toda la lógica del DOM -->
    <!-- Se carga DESPUÉS del HTML para que todos los elementos ya existan en el árbol DOM -->
    <script src="assets/js/main.js"></script>

    <!-- Botón flotante "Subir al inicio" (inicialmente oculto con display:none)        -->
    <!-- .position-fixed: se queda fijo en pantalla aunque el usuario haga scroll       -->
    <!-- bottom/right: lo posiciona en la esquina inferior derecha                      -->
    <!-- z-index:999: se asegura de que quede por encima de otros elementos             -->
    <!-- JavaScript lo mostrará automáticamente cuando el usuario baje más de 300px     -->
    <a href="#" id="scrollToTopBtn" class="btn btn-secondary position-fixed" style="bottom: 20px; right: 20px; display: none; z-index: 999;">
        ↑ Subir
    </a>

</body>
</html>
