<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owl Carousel 2</title>

    <!-- 1. Bootstrap CSS - Framework de estilos y componentes responsivos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- 2. Bootstrap Icons - Librería de íconos de Bootstrap.
         Se usa para mostrar las flechas de navegación del carrusel (bi-arrow-left-circle, bi-arrow-right-circle).
         Documentación: https://icons.getbootstrap.com/ -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- 3. Owl Carousel 2 CSS (archivos locales)
         El plugin requiere DOS archivos CSS:
         - owl.carousel.min.css  → estilos base del carrusel (estructura, posicionamiento).
         - owl.theme.default.css → estilos visuales del tema (botones de nav, puntos de paginación).
         Sin ambos archivos, el carrusel no se verá correctamente. -->
    <link rel="stylesheet" href="./assets/css/owl.carousel.min.css">
    <link rel="stylesheet" href="./assets/css/owl.theme.default.css">

    <!-- 4. Estilos propios del proyecto -->
    <link rel="stylesheet" href="./assets/css/main.css">
</head>
<body>

    <!-- =============================================
         ESTRUCTURA HTML DEL CARRUSEL (Owl Carousel 2)
         =============================================
         El carrusel requiere esta estructura mínima:
         - Un contenedor externo (aquí .carousel-wrap) para posicionar las flechas.
         - Un div con la clase "owl-carousel": el plugin busca esta clase
           para inicializar el carrusel en ese elemento.
         - Dentro, los "items": cada div.item es una diapositiva del carrusel.
           Pueden contener imágenes, texto, tarjetas, etc.
         ============================================= -->
    <div class="container">
      <div class="page-header">
        <h1>Owl Carousel 2</h1>
        <p class="subtitle">Carrusel responsivo con jQuery &mdash; se adapta a móvil, tablet y escritorio</p>
      </div>
      <hr>

      <!-- Contenedor externo: permite posicionar las flechas de nav con CSS -->
      <div class="carousel-wrap">

        <!-- La clase "owl-carousel" es OBLIGATORIA: el plugin la detecta
             automáticamente y convierte este div en un carrusel interactivo. -->
        <div class="owl-carousel">

          <!-- Cada div.item es una diapositiva.
               Las imágenes se obtienen de picsum.photos, un servicio gratuito
               de imágenes de placeholder. El formato es /id/{numero}/{ancho}/{alto} -->
          <div class="item"><img src="https://picsum.photos/id/12/300/200" alt="Imagen 1"></div>
          <div class="item"><img src="https://picsum.photos/id/13/300/200" alt="Imagen 2"></div>
          <div class="item"><img src="https://picsum.photos/id/14/300/200" alt="Imagen 3"></div>
          <div class="item"><img src="https://picsum.photos/id/15/300/200" alt="Imagen 4"></div>
          <div class="item"><img src="https://picsum.photos/id/16/300/200" alt="Imagen 5"></div>
          <div class="item"><img src="https://picsum.photos/id/17/300/200" alt="Imagen 6"></div>
          <div class="item"><img src="https://picsum.photos/id/18/300/200" alt="Imagen 7"></div>
          <div class="item"><img src="https://picsum.photos/id/19/300/200" alt="Imagen 8"></div>
          <div class="item"><img src="https://picsum.photos/id/20/300/200" alt="Imagen 9"></div>
          <div class="item"><img src="https://picsum.photos/id/21/300/200" alt="Imagen 10"></div>
          <div class="item"><img src="https://picsum.photos/id/22/300/200" alt="Imagen 11"></div>
          <div class="item"><img src="https://picsum.photos/id/23/300/200" alt="Imagen 12"></div>
        </div>

      </div>
    </div>

    <!-- =============================================
         SCRIPTS - Orden de carga IMPORTANTE
         1. Bootstrap JS
         2. jQuery        (Owl Carousel depende de jQuery)
         3. jQuery Migrate (compatibilidad con jQuery 4.x)
         4. owl.carousel.js (plugin, carga después de jQuery)
         5. main.js       (nuestro código, siempre AL FINAL)
         ============================================= -->

    <!-- 1. Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <!-- 2. jQuery - Owl Carousel 2 está construido sobre jQuery,
         por lo que este script debe cargarse ANTES que owl.carousel.js -->
    <script src="https://code.jquery.com/jquery-4.0.0.js"></script>

    <!-- 3. jQuery Migrate - Mantiene compatibilidad de plugins escritos para
         versiones anteriores de jQuery (Owl Carousel usa APIs de jQuery 3.x) -->
    <script src="https://code.jquery.com/jquery-migrate-4.0.2.js"></script>

    <!-- 4. Owl Carousel 2 JS (archivo local) - El plugin que transforma
         el div.owl-carousel en un carrusel interactivo y responsivo.
         Documentación oficial: https://owlcarousel2.github.io/OwlCarousel2/ -->
    <script src="./assets/js/owl.carousel.js"></script>

    <!-- 5. Nuestro archivo JS con la configuración del carrusel -->
    <script src="./assets/js/main.js"></script>
</body>
</html>
