<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Validación de Formulario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/main.css">
</head>

<body>

  <div class="container mt-5">
    <h1 class="mb-4">Validación de Formulario</h1>

    <!-- Alerta oculta que se mostrará al enviar el formulario exitosamente -->
    <div class="alert alert-success d-none" role="alert">
      ¡Formulario enviado correctamente!
    </div>

    <!-- Formulario a validar -->
    <form role="form" novalidate>
      <div class="mb-3">
        <label for="name" class="form-label">Nombre:</label>
        <input type="text" class="form-control" id="name" name="name" />
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Correo electrónico:</label>
        <input type="email" class="form-control" id="email" name="email" />
      </div>
      <button type="submit" class="btn btn-primary">Suscribirse</button>
    </form>
  </div>

  <!-- =============================================
       SCRIPTS - Orden de carga IMPORTANTE
       Los scripts deben cargarse en este orden:
       1. Bootstrap (para los estilos y componentes)
       2. jQuery (librería principal, base de todo)
       3. jQuery Migrate (compatibilidad entre versiones de jQuery)
       4. jQuery Validation (plugin que depende de jQuery)
       5. main.js (nuestro código, debe ir siempre AL FINAL)
       ============================================= -->

  <!-- 1. Bootstrap JS (incluye Popper.js para componentes interactivos) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>

  <!-- 2. jQuery - Librería JavaScript que simplifica la manipulación del DOM,
       el manejo de eventos, animaciones y peticiones AJAX.
       Sin jQuery, el plugin de validación NO funcionará. -->
  <script src="https://code.jquery.com/jquery-4.0.0.js"></script>

  <!-- 3. jQuery Migrate - Permite usar código escrito para versiones anteriores de jQuery.
       Útil cuando se usan plugins que aún no se han actualizado a jQuery 4.x -->
  <script src="https://code.jquery.com/jquery-migrate-4.0.2.js"></script>

  <!-- 4. jQuery Validation Plugin - Plugin que extiende jQuery para validar
       formularios fácilmente. Permite definir reglas, mensajes de error
       personalizados y acciones al enviar el formulario de forma exitosa.
       Documentación oficial: https://jqueryvalidation.org/ -->
  <script src="https://cdn.jsdelivr.net/jquery.validation/1.15.0/jquery.validate.min.js"></script>

  <!-- 5. Nuestro archivo JS personalizado.
       Siempre debe ir AL FINAL, después de todas las librerías,
       para asegurarse de que jQuery y el plugin ya estén disponibles. -->
  <script src="assets/js/main.js"></script>

</body>

</html>
