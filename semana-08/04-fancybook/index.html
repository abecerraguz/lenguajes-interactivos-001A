<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galería Fancybox + Bootstrap</title>

  <!-- 1. Bootstrap CSS - Framework de estilos y componentes responsivos -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- 2. Fancybox CSS (@fancyapps/ui v5)
       Agrega los estilos del lightbox: overlay oscuro, botones de navegación,
       barra de herramientas, miniaturas (thumbnails), animaciones, etc.
       NOTA: Esta versión (v5) NO depende de jQuery. Funciona con JavaScript puro.
       Documentación oficial: https://fancyapps.com/fancybox/ -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@fancyapps/ui/dist/fancybox/fancybox.css"
  />
  <!-- 3. Estilos propios -->
  <link rel="stylesheet" href="assets/css/main.css" />
</head>
<body class="py-5">

  <div class="container">

    <!-- Cabecera de la galería -->
    <div class="page-header text-center mb-5">
      <h1 class="fw-bold">Galería con Fancybox</h1>
      <p>Haz clic en cualquier imagen para abrirla en el lightbox.</p>
    </div>

    <!-- =============================================
         ESTRUCTURA DE LA GALERÍA

         Cada imagen sigue este patrón:
         <a data-fancybox="gallery" href="imagen-grande">
           <img src="miniatura" />
         </a>

         CÓMO FUNCIONA:
         - El atributo data-fancybox="gallery" le indica a Fancybox
           que este enlace forma parte de un grupo llamado "gallery".
         - Todos los elementos con el mismo valor en data-fancybox
           quedan agrupados: el usuario puede navegar entre ellos
           con las flechas sin cerrar el lightbox.
         - href="..."  → URL de la imagen en alta resolución (la que
                         se muestra al abrir el lightbox).
         - src="..."   → URL de la miniatura visible en la página.

         ESTRUCTURA BOOTSTRAP:
         - .row.g-4   → fila con gap de 1.5rem entre columnas y filas
         - .col-sm-6.col-md-4 → 2 columnas en tablet, 3 en escritorio
         ============================================= -->
    <div class="row g-4">

      <!-- Imagen 1 -->
      <div class="col-sm-6 col-md-4">
        <a class="gallery-item" data-fancybox="gallery" href="https://picsum.photos/id/1015/1200/800"
           data-caption="Paisaje de montaña">
          <img src="https://picsum.photos/id/1015/600/400" class="gallery-img" alt="Montaña" />
        </a>
      </div>

      <!-- Imagen 2 -->
      <div class="col-sm-6 col-md-4">
        <a class="gallery-item" data-fancybox="gallery" href="https://picsum.photos/id/1016/1200/800"
           data-caption="Atardecer en la playa">
          <img src="https://picsum.photos/id/1016/600/400" class="gallery-img" alt="Playa" />
        </a>
      </div>

      <!-- Imagen 3 -->
      <div class="col-sm-6 col-md-4">
        <a class="gallery-item" data-fancybox="gallery" href="https://picsum.photos/id/1018/1200/800"
           data-caption="Bosque antiguo">
          <img src="https://picsum.photos/id/1018/600/400" class="gallery-img" alt="Bosque" />
        </a>
      </div>

      <!-- Imagen 4 -->
      <div class="col-sm-6 col-md-4">
        <a class="gallery-item" data-fancybox="gallery" href="https://picsum.photos/id/1019/1200/800"
           data-caption="Río de montaña">
          <img src="https://picsum.photos/id/1019/600/400" class="gallery-img" alt="Río" />
        </a>
      </div>

      <!-- Imagen 5 -->
      <div class="col-sm-6 col-md-4">
        <a class="gallery-item" data-fancybox="gallery" href="https://picsum.photos/id/1020/1200/800"
           data-caption="Pradera en primavera">
          <img src="https://picsum.photos/id/1020/600/400" class="gallery-img" alt="Pradera" />
        </a>
      </div>

      <!-- Imagen 6 -->
      <div class="col-sm-6 col-md-4">
        <a class="gallery-item" data-fancybox="gallery" href="https://picsum.photos/id/1022/1200/800"
           data-caption="Lago al amanecer">
          <img src="https://picsum.photos/id/1022/600/400" class="gallery-img" alt="Lago" />
        </a>
      </div>

    </div>
  </div>

  <!-- =============================================
       SCRIPTS - Orden de carga IMPORTANTE
       1. Bootstrap JS
       2. Fancybox JS  (no requiere jQuery)
       3. Script de configuración (siempre AL FINAL)
       ============================================= -->

  <!-- 1. Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- 2. Fancybox JS (@fancyapps/ui v5)
       Expone el objeto global "Fancybox" que usamos en el script siguiente.
       A diferencia de versiones anteriores (v3/v4), esta versión NO necesita jQuery. -->
  <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui/dist/fancybox/fancybox.umd.js"></script>
 
  <!-- 3. Nuestro script de configuración -->
  <script src="assets/js/main.js"></script>

</body>
</html>
